name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: worknest

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version used locally, so a new Flutter release
          # can't break the build (newer versions also need a Gradle upgrade)
          flutter-version: 3.32.5

      # .env is gitignored but listed as an asset in pubspec.yaml; analyze and
      # tests don't need real values, so an empty file is enough
      - name: Create empty .env
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
